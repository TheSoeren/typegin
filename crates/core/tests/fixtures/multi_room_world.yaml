objects:
  - key: glowing-sword
    primary_name: glowing mysterious sword
    aliases: [glowing sword, sword]
    kind: Item

  - key: iron-key
    primary_name: iron key
    aliases: [key, rusty key]
    kind: Item
    extra:
      weight: 3
      opens: chest
      materials: [metal, iron]
      tags:
        kind: key
      gui:
        icon: sprites/key.png

  - key: locked-chest
    primary_name: locked chest
    aliases: [chest]
    kind: Item

  - key: brass-key
    primary_name: brass key
    aliases: [key]
    kind: Item

  - key: stale-bread
    primary_name: stale bread
    aliases: [bread]
    kind: Item

  - key: rusty-lamp
    primary_name: rusty lamp
    aliases: [lamp]
    kind: Item

  - key: old-map
    primary_name: old map
    aliases: [map]
    kind: Item

  - key: cellar-stairs
    primary_name: cellar stairs
    aliases: [stairs]
    kind: Scene
    door:
      direction: north
      to: corridor

  - key: corridor-stairs
    primary_name: cellar stairs
    aliases: [stairs]
    kind: Scene
    door:
      direction: south
      to: cellar

  - key: study-door
    primary_name: study door
    aliases: [door]
    kind: Scene
    door:
      direction: east
      to: study

  - key: wooden-door
    primary_name: wooden door
    aliases: [door]
    kind: Scene
    door:
      direction: west
      to: corridor

  - key: secret-passage
    primary_name: secret passage
    aliases: [passage]
    kind: Scene
    door:
      direction: north
      to: cellar

  - key: hidden-vault
    primary_name: hidden vault
    aliases: [vault]
    kind: Scene
    door:
      direction: south
      to: cellar
      locked: true

  - key: oak-door
    primary_name: oak door
    aliases: [door]
    kind: Scene
    door:
      direction: east
      to: corridor
      locked: true
    extra:
      material: oak

rooms:
  - key: cellar
    name: The Damp Cellar
    visible_objects: [glowing-sword, iron-key, locked-chest, brass-key, cellar-stairs]
    hidden_objects: [stale-bread]
    extra:
      dark: true
      gui:
        background: bg/cellar.png

  - key: corridor
    name: The Torchlit Corridor
    visible_objects: [rusty-lamp, old-map, corridor-stairs, study-door]
    hidden_objects: []

  - key: study
    name: The Dusty Study
    visible_objects: [wooden-door, oak-door]
    hidden_objects: [secret-passage, hidden-vault]

interactions:
  - verb: use
    item: iron-key
    target:
      object: oak-door
    condition:
      - exit_locked: east
    effect:
      - unlock_exit: east
      - emit: unlock-authored

  - verb: examine
    target:
      object: oak-door
    effect:
      - reveal_exit: north
      - emit: passage-found

  - verb: take
    item: glowing-sword
    effect:
      - emit: intercepted

  - verb: drop
    item: old-map
    effect:
      - emit: map-returned
