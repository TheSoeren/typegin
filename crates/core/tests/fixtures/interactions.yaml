interactions:
  - verb: use
    item: iron-key
    target:
      object: oak-door
    condition:
      - exit_locked: east
    effect:
      - unlock_exit: east
      - emit: unlock-authored

  - verb: examine
    target:
      object: oak-door
    effect:
      - reveal_exit: north
      - emit: passage-found

  - verb: take
    item: glowing-sword
    effect:
      - emit: intercepted

  - verb: drop
    item: old-map
    effect:
      - emit: map-returned
