# Canonical authored fixtures shared by the keyed-world test suites
# (data_interactions, flags, npcs, symbolic_keys, triggers). Identity is a
# stable `key` string; all cross-references are keys.
objects:
  - key: iron-key
    primary_name: iron key
    aliases: [key, rusty key]
    kind: Item

  - key: brass-key
    primary_name: brass key
    aliases: [key]
    kind: Item

  - key: rusty-lamp
    primary_name: rusty lamp
    aliases: [lamp]
    kind: Item

  - key: stale-bread
    primary_name: stale bread
    aliases: [bread]
    kind: Item

  - key: cellar-stairs
    primary_name: cellar stairs
    aliases: [stairs]
    kind: Scene
    door:
      direction: north
      to: corridor

  - key: corridor-stairs
    primary_name: cellar stairs
    aliases: [stairs]
    kind: Scene
    door:
      direction: south
      to: cellar

  - key: study-door
    primary_name: study door
    aliases: [door]
    kind: Scene
    door:
      direction: east
      to: study

  - key: wooden-door
    primary_name: wooden door
    aliases: [door]
    kind: Scene
    door:
      direction: west
      to: corridor

  - key: secret-passage
    primary_name: secret passage
    aliases: [passage]
    kind: Scene
    door:
      direction: north
      to: cellar

  - key: oak-door
    primary_name: oak door
    aliases: [door]
    kind: Scene
    door:
      direction: east
      to: corridor
      locked: true

  - key: rusty-nail
    primary_name: rusty nail
    aliases: [nail]
    kind: Item

rooms:
  - key: cellar
    name: The Cellar
    visible_objects: [iron-key, brass-key, rusty-lamp, cellar-stairs]
    hidden_objects: [stale-bread]

  - key: corridor
    name: The Corridor
    visible_objects: [corridor-stairs, study-door]
    hidden_objects: []

  - key: study
    name: The Study
    visible_objects: [wooden-door, oak-door]
    hidden_objects: [secret-passage]
