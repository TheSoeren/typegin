# Canonical authored fixtures for the data-driven interactions suite. Room
# identity is a `key` string; object memberships are object keys.
rooms:
  - key: cellar
    name: The Cellar
    visible_objects: [iron-key, brass-key, rusty-lamp, cellar-stairs]
    hidden_objects: [stale-bread]

  - key: corridor
    name: The Corridor
    visible_objects: [corridor-stairs, study-door]
    hidden_objects: []

  - key: study
    name: The Study
    visible_objects: [wooden-door, oak-door]
    hidden_objects: [secret-passage]
