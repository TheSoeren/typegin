# NPC whose choice emits a flag and a custom beat.
npcs:
  - key: guard
    primary_name: guard
    aliases: [sentry]
    room: corridor
    dialogue:
      root: greeting
      nodes:
        greeting:
          text: "The guard looks at you."
          choices:
            - label: Ask about the escape
              next: about-escape
              effect:
                - set_flag: guard-told-about-key
                - emit: guard-told-beat
        about-escape:
          text: "Don't try it."
