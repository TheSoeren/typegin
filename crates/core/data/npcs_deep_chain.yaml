# NPC with a chain of three nodes (greeting → ask → answer).
npcs:
  - key: guard
    primary_name: guard
    aliases: [sentry]
    room: corridor
    dialogue:
      root: greeting
      nodes:
        greeting:
          text: "The guard looks at you."
          choices:
            - label: Ask about the key
              next: ask-key
        ask-key:
          text: "What key?"
          choices:
            - label: The brass key
              next: answer-key
        answer-key:
          text: "Oh, that key. It's in the cellar."
