rooms:
  - key: player-cell
    name: The Padded Cell
    visible_objects: [chair, table, wall-polster, door-grate, cell-door,
      nail-clipper]
    hidden_objects: [chair-leg, fan, vent-grille]
    extra:
      description: A padded cell, every wall bundled in soft polster. Edna's head hurts.

  - key: air-chute
    name: The Air Chute
    visible_objects: [air-chute-to-cell, air-chute-to-office]
    hidden_objects: []
    extra:
      description: A cramped, dusty ventilation chute.

  - key: dr-marcel-office
    name: Dr. Marcel's Office
    visible_objects: [office-to-air-chute, office-door, encyclopedia, polo-mallet, ballpoint-pen,
      cabinet]
    hidden_objects: []
    extra:
      description: The office of Dr. Marcel. Books, a diploma, and somewhere to hide.

  - key: corridor
    name: The Guard Corridor
    visible_objects: []
    hidden_objects: []
    extra:
      description: The corridor outside the cell. A guard polishes his putter.