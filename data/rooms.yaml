# Rooms for the terminal demo — faithful to Edna & Harvey: The Breakout.
# Only the first room (the padded cell) is playable; it ends in the
# ventilation shaft, where the game's second section would begin.
rooms:
  - key: player-cell
    name: The Padded Cell
    visible_objects: [chair, table, padding, door-grate, cell-door]
    hidden_objects: [chair-leg, airy-gap, vent-grille, fan, shaft-entrance]
    extra:
      description: A padded cell in the sanatorium. It is oppressively hot — the air conditioning is off.

  - key: air-chute
    name: The Ventilation Shaft
    visible_objects: []
    hidden_objects: []
    extra:
      description: You crawl through the fan opening into a dark, dusty ventilation shaft.