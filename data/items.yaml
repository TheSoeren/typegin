objects:
  # Objects in the players cell
  - key: chair
    primary_name: Chair
    aliases: [chair]
    kind: Item
    extra:
      description: A plain old chair

  - key: table
    primary_name: Table
    aliases: [table]
    kind: Scene
    extra:
      description: A plain old table

  - key: exit-door
    primary_name: Cell Door
    aliases: [cell door, door]
    kind: Scene
    door:
      direction: east
      to: corridor
      locked: true
    extra:
      description: A plain old table

  - key: wall-polster
    primary_name: Wall Polster
    aliases: [wall polster, polster]
    kind: Scene
    extra:
      description: All walls are lined with this thick, soft polster

  - key: vent
    primary_name: Vent
    aliases: [vent]
    kind: Scene
    door:
      direction: north
      to: vent-corridor
      locked: true
      hidden: true
      gated_by: fingernail

  - key: fingernail
    primary_name: Fingernail
    aliases: [fingernail]
    kind: Item

  - key: chair-leg
    primary_name: Chair leg
    aliases: [chair leg, leg]
    kind: Item

  - key: chipped-chair-leg
    primary_name: Chipped Chair Leg
    aliases: [chipped chair leg, chipped leg, chair leg, leg]
    kind: Item

  - key: nail-clipper
    primary_name: Nail clipper
    aliases: [nail clipper, clipper]
    kind: Item
