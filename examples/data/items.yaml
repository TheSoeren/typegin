# Faithful to Edna & Harvey: The Breakout — the padded cell (first room).
#
# Only objects that exist in the game's opening cell are modelled. The one
# meaningful pad is a stand-in for the 19 pads (see TODO.md). Harvey is a
# room-bound NPC stand-in for the game's inventory-companion rabbit; the
# tempomorph memory detour that yields "Harvey 1: Toenails" is approximated by
# a dialogue choice (see TODO.md).
objects:
  ### THE PADDED CELL
  - key: chair
    primary_name: Chair
    aliases: [chair]
    kind: Scene
    extra:
      description: A plain wooden chair. Its front-left leg is loose.
      gui:
        hotspot: { x: 80, y: 370, w: 90, h: 140 }
        sprite: chair_default

  - key: chair-leg
    primary_name: Chair leg
    aliases: [chair leg, leg]
    kind: Item
    extra:
      description: The loose chair leg, good for breaking things.

  - key: broken-chair-leg
    primary_name: Broken chair leg
    aliases: [broken chair leg, splintered chair leg, stick, splinter]
    kind: Item
    extra:
      description: A chair leg broken into a splintered weapon.

  - key: table
    primary_name: Table
    aliases: [table]
    kind: Scene
    extra:
      description: A plain table, with a surface made for breaking things over.
      gui:
        hotspot: { x: 300, y: 385, w: 140, h: 110 }
        sprite: table_default

  - key: padding
    primary_name: Padded wall
    aliases: [padded wall, wall padding, padding, pads, wall]
    kind: Scene
    extra:
      description: Endless layers of soft padding. The third pad from the top, on the left of the back wall, is where the air conditioning disguises the way out.
      gui:
        hotspot: { x: 40, y: 50, w: 720, h: 250 }
        sprite: padding_default

  - key: door-grate
    primary_name: Door grate
    aliases: [door grate, grate]
    kind: Scene
    extra:
      description: A small grate high in the cell door, the only window to the guard corridor.
      gui:
        hotspot: { x: 660, y: 110, w: 40, h: 40 }
        sprite: door_grate_default

  - key: cell-door
    primary_name: Cell door
    aliases: [cell door, door]
    kind: Scene
    extra:
      description: The cell door, solidly locked. Up high, a grate.
      gui:
        hotspot: { x: 620, y: 80, w: 120, h: 220 }
        sprite: cell_door_default

  - key: airy-gap
    primary_name: Airy gap
    aliases: [airy gap, gap]
    kind: Scene
    extra:
      description: An airy gap in the padding where the torn pad fell away.

  - key: vent-grille
    primary_name: Vent grille
    aliases: [vent grille, grille, screws]
    kind: Scene
    extra:
      description: A grille held by four screws. Beyond it, the air conditioning.

  - key: fan
    primary_name: Air-conditioning fan
    aliases: [air conditioning fan, ac fan, fan, ventilator]
    kind: Scene
    extra:
      description: A big air-conditioning fan. Still, for now.

  - key: shaft-entrance
    primary_name: Ventilation shaft opening
    aliases: [ventilation shaft, shaft, opening, hole]
    kind: Scene
    door:
      direction: north
      to: air-chute
      locked: true
      hidden: true

  - key: toenail
    primary_name: Toenail
    aliases: [toenail, toe nail, nail]
    kind: Item
    extra:
      description: A long, sturdy toenail. The chestnut thief's trick — you remember now.
