# Faithful sequence of the padded-cell escape from Edna & Harvey: The Breakout.
#
# The real game's order: (1) rip the padding with the broken chair leg,
# (2) have the guard turn the air conditioning ON so the torn pad falls away,
# exposing an "airy gap", (3) open the gap with the broken chair leg to reveal
# the vent grille, (4) unscrew it with a toenail to expose the fan, (5) have the
# guard turn the air conditioning OFF, (6) remove the still fan and crawl out.
#
# Step (2)'s reveal is a `data/triggers.yaml` world-event, not an interaction
# here: the airy gap exposes itself automatically the instant both
# `pads-ripped` and `ac-on` hold, in whichever order the player reaches them
# — no need to re-use the stick on the padding a second time once the air
# turns on.
#
# Dispatch is first-match, so gated variants are ordered before their fallback.
interactions:
  ### THE PADDED CELL
  # 1) Examine the chair to discover the loose leg (only while it is still
  #    out in the room).
  - verb: examine
    target:
      object: chair
    condition:
      - not:
          player_holds: chair-leg
      - not:
          flag: chair-leg-revealed
    effect:
      - reveal_object: chair-leg
      - set_flag: chair-leg-revealed
      - emit: The chair wobbles on three legs. The front-left leg is barely screwed on — it pulls free with a good tug.

  # 2) Snap the chair leg over the table.
  - verb: use
    item: chair-leg
    target:
      object: table
    effect:
      - discard: chair-leg
      - grant: broken-chair-leg
      - emit: You lay the chair leg across the table, bear down, and it snaps into a splintered, weaponlike stick.

  # 3) Rip the padding with the broken chair leg. One pad (third from the
  #    top, left of the back wall) tears in a distinctive way.
  - verb: use
    item: broken-chair-leg
    target:
      object: padding
    condition:
      - not:
          flag: pads-ripped
    effect:
      - set_flag: pads-ripped
      - emit: You slash the padding to ribbons. The third pad from the top, on the left of the back wall, tears open in a way the others don't.

  # Hint: the pad holds fast while the air is off (once it has fallen away,
  # this no longer matches — see the `airy-gap-reveal` trigger).
  - verb: use
    item: broken-chair-leg
    target:
      object: padding
    condition:
      - flag: pads-ripped
      - not:
          flag: ac-on
    effect:
      - emit: The torn pad sags but holds. If only the air conditioning were running — a draft would tear it away.

  # 5) Open the airy gap with the broken chair leg — the vent grille behind it.
  - verb: use
    item: broken-chair-leg
    target:
      object: airy-gap
    effect:
      - reveal_object: vent-grille
      - emit: "You wrench the gap open with the splintered leg. Behind it: a vent grille held by four screws."

  # 6) Unscrew the grille with the toenail, exposing the fan.
  - verb: use
    item: toenail
    target:
      object: vent-grille
    condition:
      - not:
          flag: grille-off
    effect:
      - set_flag: grille-off
      - reveal_object: fan
      - emit: Four screws, four turns. The grille comes away and you see the big air-conditioning fan humming behind it.

  # 7) Remove the fan. Only possible once its motor is off (guard talked into
  #    turning off the air conditioning) and the grille is out of the way.
  - verb: use
    item: broken-chair-leg
    target:
      object: fan
    condition:
      - flag: grille-off
      - not:
          flag: ac-on
    effect:
      - emit: "With the motor still, you and Harvey work the heavy fan loose and ease it aside. Behind it: the ventilation shaft, dark and open."
      - unlock_exit: north
      - reveal_exit: north

  ### Flavour beats (gated variants first)
  - verb: examine
    target:
      object: padding
    condition:
      - flag: pads-ripped
    effect:
      - emit: The third pad from the top is torn open. It sags, waiting for a draft to pull it away.

  - verb: examine
    target:
      object: padding
    effect:
      - emit: Endless layers of soft padding. Three from the top, on the left of the back wall, you notice something behind the cloth.

  - verb: examine
    target:
      object: fan
    condition:
      - flag: ac-on
    effect:
      - emit: The big air-conditioning fan hums, dragging warm air through the shaft.

  - verb: examine
    target:
      object: fan
    condition:
      - flag: grille-off
    effect:
      - emit: The fan is still. Behind it, an opening into the ventilation shaft.

  - verb: examine
    target:
      object: fan
    effect:
      - emit: A big air-conditioning fan, silent.

  - verb: examine
    target:
      object: vent-grille
    effect:
      - emit: A grille held by four screws. Behind it, the air conditioning.

  - verb: examine
    target:
      object: door-grate
    effect:
      - emit: A small grate high in the cell door. Beyond it, the guard corridor.

  - verb: examine
    target:
      object: cell-door
    effect:
      - emit: The cell door, solidly locked. The only way out is through the walls.
